model_list:
  - model_name: local
    litellm_params:
      model: ollama_chat/ministral-3:8b
      api_base: http://100.82.40.70:11434

  - model_name: embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://100.82.40.70:11434

  - model_name: cheap
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: smart
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  fallbacks:
    - local: ["cheap"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
