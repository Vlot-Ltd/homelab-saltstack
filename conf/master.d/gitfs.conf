# States served from git, not from a checkout. PEP-HL-SLT-010.
fileserver_backend:
  - gitfs

gitfs_provider: pygit2
gitfs_base: main
# origin also has a `gitworkflow` branch; without this it becomes a saltenv.
gitfs_saltenv_whitelist:
  - base
gitfs_pubkey: /etc/salt/gitfs/deploy_key.pub
gitfs_privkey: /etc/salt/gitfs/deploy_key

gitfs_remotes:
  - git@github.com:Vlot-Ltd/homelab-saltstack.git:
    - root: salt
