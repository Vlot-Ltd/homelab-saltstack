# Pillar from git, then Vault. PEP-HL-SLT-010.
# Order matters: the vault paths use {pillar[roles]}, which comes from the
# git pillar (database/roles.sls, monitoring/roles.sls), so git must be first.
# This is the only place ext_pillar is set; master.d keys replace, not merge
# with, the same key in /etc/salt/master.
git_pillar_provider: pygit2
git_pillar_pubkey: /etc/salt/gitfs/deploy_key.pub
git_pillar_privkey: /etc/salt/gitfs/deploy_key

ext_pillar:
  - git:
    - main git@github.com:Vlot-Ltd/homelab-saltstack.git:
      - root: pillar
      - env: base
  - vault:
      path: salt/roles/{pillar[roles]}
  - vault:
      path: salt/minions/{minion}
  - vault:
      path: salt/general
